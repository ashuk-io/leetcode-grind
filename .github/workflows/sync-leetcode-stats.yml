name: Sync LeetCode stats in README

on:
  push:
    paths:
      - stats.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme-stats:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README stats block from stats.json
        run: python scripts/sync_leetcode_stats.py

      - name: Commit and push README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README stats already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync LeetCode stats in README"
          git push
